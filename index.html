<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XNB Unpacker for Stardew Valley 1.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f4; --surface: #ffffff; --ink: #1f2430; --muted: #5d6577;
    --accent: #2f6f5e; --accent-ink: #ffffff; --line: #d5d9e2; --bad: #a3322b; --ok: #2f6f5e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f; --surface: #1c222c; --ink: #e8ebf2; --muted: #98a1b3;
      --accent: #7fc8a9; --accent-ink: #10231b; --line: #2c3442; --bad: #ff8f86; --ok: #7fc8a9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --surface: #1c222c; --ink: #e8ebf2; --muted: #98a1b3;
    --accent: #7fc8a9; --accent-ink: #10231b; --line: #2c3442; --bad: #ff8f86; --ok: #7fc8a9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 1rem/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .35rem; font-weight: 700; letter-spacing: -.01em; }
  .sub { margin: 0 0 1.75rem; color: var(--muted); }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: .6rem; padding: .2rem; background: var(--surface); margin-bottom: 1rem; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; padding: .45rem 1.1rem; border-radius: .45rem; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 1rem; background: var(--surface);
    padding: 2.5rem 1.25rem; text-align: center; cursor: pointer; transition: border-color .15s, background-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.over { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .drop strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
  .drop span { color: var(--muted); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 3px; }
  .opts { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin: 1rem 0 0; }
  .opts label { display: flex; gap: .5rem; align-items: center; cursor: pointer; }
  .opts input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: .9rem; margin: .35rem 0 0 1.6rem; }
  .opts select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .4rem; padding: .25rem .5rem; }
  .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-top: 1.25rem; }
  button.primary, a.btn {
    border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700;
    padding: .6rem 1.2rem; border-radius: .6rem; cursor: pointer; text-decoration: none; display: inline-block;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost, a.ghost {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
    padding: .45rem .9rem; border-radius: .6rem; cursor: pointer; text-decoration: none; display: inline-block;
  }
  button:focus-visible, a:focus-visible, select:focus-visible, .opts input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { margin: 1.25rem 0 0; min-height: 1.5rem; color: var(--muted); }
  ul.results { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .5rem; }
  ul.results li { display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; padding: .7rem .9rem; }
  ul.results .name { overflow-wrap: anywhere; }
  ul.results .size { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  ul.results li.err { border-color: var(--bad); }
  ul.results li.err .msg { color: var(--bad); font-size: .92rem; display: block; overflow-wrap: anywhere; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>XNB Unpacker for Stardew Valley 1.6</h1>
  <p class="sub">Unpack and repack <code>.xnb</code> game files in your browser. Nothing is uploaded.</p>

  <div class="tabs" role="tablist" aria-label="Mode">
    <button role="tab" id="tab-unpack" aria-selected="true" aria-controls="panel-unpack">Unpack</button>
    <button role="tab" id="tab-pack" aria-selected="false" aria-controls="panel-pack">Pack</button>
  </div>

  <section id="panel-unpack" role="tabpanel" aria-labelledby="tab-unpack">
    <label class="drop" id="drop-unpack">
      <input type="file" id="in-unpack" accept=".xnb" multiple>
      <strong>Drop .xnb files here</strong>
      <span>or tap to choose files</span>
    </label>
    <div class="opts">
      <label><input type="checkbox" id="opt-yaml"> Export header as YAML (XnbExtract style)</label>
      <label><input type="checkbox" id="opt-content"> Content only (skip the header file)</label>
    </div>
  </section>

  <section id="panel-pack" role="tabpanel" aria-labelledby="tab-pack" hidden>
    <label class="drop" id="drop-pack">
      <input type="file" id="in-pack" accept=".json,.yaml,.yml,.png,.tbin,.cso,.xml,.fnt" multiple>
      <strong>Drop the unpacked files here</strong>
      <span>Choose the .json (or .yaml) header together with its .png/.tbin files</span>
    </label>
    <div class="opts">
      <label>Compression
        <select id="opt-compression">
          <option value="default">Same as the header says</option>
          <option value="none">None</option>
          <option value="LZ4">LZ4 (smaller, the game reads it)</option>
        </select>
      </label>
    </div>
    <div class="row"><button class="primary" id="btn-pack" disabled>Pack to .xnb</button></div>
  </section>

  <p id="status" role="status" aria-live="polite">Loading the converter…</p>
  <ul class="results" id="results"></ul>
  <div class="row" id="all-row" hidden><button class="ghost" id="btn-zip">Download all as .zip</button></div>

  <footer>
    Built on <a href="https://github.com/lybell-art/xnb-js">xnb.js</a> by Lybell (credit to LeonBlade's xnbcli).
    Stardew Valley 1.6 data layouts generated from the game's own <code>StardewValley.GameData.dll</code>.
  </footer>
</main>

<script type="module">
import { makeZip } from "./zip.js";
import { schemes, enums } from "./schemes-1.6.js";

// Pin the library version here. 1.3.0 is the version shown in the xnb.js README;
// bump it if you want a newer release.
const XNB_URL = "https://cdn.jsdelivr.net/npm/xnb@1.3.0/dist/xnb.module.js";

const $ = (id) => document.getElementById(id);
const statusEl = $("status"), resultsEl = $("results"), allRow = $("all-row");
let XNB = null;
let outputs = [];          // [{ name, blob }]
let packFiles = [];

function setStatus(t) { statusEl.textContent = t; }
function fmt(n) { return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }

async function loadLibrary() {
  try {
    XNB = await import(XNB_URL);
    XNB.addSchemes(schemes);
    XNB.addEnums(enums);
    setStatus("Ready. " + Object.keys(schemes).length + " Stardew 1.6 data types loaded.");
  } catch (e) {
    console.error(e);
    setStatus("Could not load the converter library (" + e.message + "). Check your connection and reload.");
  }
}

function clearResults() { resultsEl.textContent = ""; outputs = []; allRow.hidden = true; }

function addResult(name, blob, errorMessage) {
  const li = document.createElement("li");
  const left = document.createElement("div");
  const nm = document.createElement("span"); nm.className = "name"; nm.textContent = name; left.appendChild(nm);
  if (errorMessage) {
    li.className = "err";
    const m = document.createElement("span"); m.className = "msg"; m.textContent = errorMessage; left.appendChild(m);
    li.appendChild(left);
  } else {
    li.appendChild(left);
    const size = document.createElement("span"); size.className = "size"; size.textContent = fmt(blob.size); li.appendChild(size);
    const a = document.createElement("a"); a.className = "ghost"; a.textContent = "Download"; a.download = name;
    a.href = URL.createObjectURL(blob); li.appendChild(a);
    outputs.push({ name, blob });
  }
  resultsEl.appendChild(li);
  allRow.hidden = outputs.length < 2;
}

async function unpackFiles(fileList) {
  if (!XNB) return setStatus("The converter is not loaded yet.");
  clearResults();
  const files = [...fileList].filter((f) => /\.xnb$/i.test(f.name));
  if (!files.length) return setStatus("Choose files that end in .xnb.");
  const yaml = $("opt-yaml").checked, contentOnly = $("opt-content").checked;
  let failed = 0;
  for (const [i, file] of files.entries()) {
    setStatus("Unpacking " + (i + 1) + " of " + files.length + ": " + file.name);
    const base = file.name.replace(/\.xnb$/i, "");
    try {
      const parts = await XNB.unpackToFiles(file, { fileName: base, yaml, contentOnly });
      for (const { data, extension } of parts) {
        const blob = data instanceof Blob ? data : new Blob([data]);
        addResult(base + "." + extension, blob);
      }
    } catch (e) {
      failed++; console.error(file.name, e);
      addResult(file.name, null, e && e.message ? e.message : String(e));
    }
  }
  setStatus(failed ? "Done. " + failed + " of " + files.length + " files could not be unpacked." : "Done. " + outputs.length + " files ready.");
}

function normalizePack(result) {
  // xnb.js documents pack() but not its return shape, so accept the plausible ones.
  const out = [];
  const push = (name, data) => out.push({ name, blob: data instanceof Blob ? data : new Blob([data]) });
  if (Array.isArray(result)) {
    result.forEach((r, i) => {
      if (r && r.data !== undefined) push(r.name || r.fileName || ("packed-" + (i + 1) + ".xnb"), r.data);
      else if (r instanceof Blob || r instanceof Uint8Array || r instanceof ArrayBuffer) push("packed-" + (i + 1) + ".xnb", r);
    });
  } else if (result instanceof Blob || result instanceof Uint8Array || result instanceof ArrayBuffer) {
    push("packed.xnb", result);
  } else if (result && typeof result === "object") {
    for (const [k, v] of Object.entries(result)) if (v instanceof Blob || v instanceof Uint8Array || v instanceof ArrayBuffer) push(/\.xnb$/i.test(k) ? k : k + ".xnb", v);
  }
  return out;
}

async function packNow() {
  if (!XNB) return setStatus("The converter is not loaded yet.");
  clearResults();
  setStatus("Packing " + packFiles.length + " files…");
  try {
    const result = await XNB.pack(packFiles, { compression: $("opt-compression").value });
    const items = normalizePack(result);
    if (!items.length) throw new Error("The converter returned nothing. Make sure the .json header is selected with its content files.");
    for (const it of items) addResult(it.name, it.blob);
    setStatus("Done. " + items.length + " .xnb file(s) ready.");
  } catch (e) {
    console.error(e); setStatus("Packing failed: " + (e && e.message ? e.message : e));
  }
}

function wireDrop(zoneId, inputId, onFiles) {
  const zone = $(zoneId), input = $(inputId);
  input.addEventListener("change", () => { onFiles(input.files); input.value = ""; });
  ["dragenter", "dragover"].forEach((ev) => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
}

wireDrop("drop-unpack", "in-unpack", unpackFiles);
wireDrop("drop-pack", "in-pack", (files) => {
  packFiles = [...files];
  $("btn-pack").disabled = !packFiles.length;
  setStatus(packFiles.length + " file(s) selected: " + packFiles.map((f) => f.name).join(", "));
});
$("btn-pack").addEventListener("click", packNow);

$("btn-zip").addEventListener("click", async () => {
  const files = await Promise.all(outputs.map(async (o) => ({ name: o.name, data: new Uint8Array(await o.blob.arrayBuffer()) })));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(makeZip(files)); a.download = "xnb-output.zip"; a.click();
});

for (const mode of ["unpack", "pack"]) {
  $("tab-" + mode).addEventListener("click", () => {
    for (const m of ["unpack", "pack"]) {
      $("tab-" + m).setAttribute("aria-selected", String(m === mode));
      $("panel-" + m).hidden = m !== mode;
    }
    clearResults();
  });
}

loadLibrary();
</script>
</body>
</html>
